<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noor Tasbih — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f6f8f6;
        color: #10241d;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #dce6df;
        border-radius: 24px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.6;
        color: #4b6358;
      }
      button {
        background: #0b5e46;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Noor Tasbih</h1>
      <p>You are currently offline. Reopen the cached app home screen or tap below once your page is cached.</p>
      <button onclick="window.location.href='./'">Open Noor Tasbih</button>
    </div>
  </body>
</html>
